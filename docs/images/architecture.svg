  <g transform="translate(315 154)"><rect width="205" height="128" rx="13" fill="#122331" stroke="#2b5261"/><circle cx="27" cy="29" r="13" fill="#173e43"/><text x="23" y="34" fill="#76e4d7" font-size="14">⌁</text><text x="20" y="65" fill="#e3edf5" font-size="14" font-weight="650">Signal monitor</text><text x="20" y="88" fill="#8ea2b3" font-size="11">Thresholds · incident grouping</text><text x="20" y="106" fill="#8ea2b3" font-size="11">FastAPI · in-memory event window</text></g>
  <g transform="translate(578 154)"><rect width="237" height="128" rx="13" fill="#162931" stroke="#4c8a83"/><circle cx="27" cy="29" r="13" fill="#1c4b47"/><text x="23" y="34" fill="#81edda" font-size="14">✳</text><text x="20" y="65" fill="#e3edf5" font-size="14" font-weight="650">Bounded triage workflow</text><text x="20" y="88" fill="#9ab2b8" font-size="11">Signal · procedure · impact steps</text><text x="20" y="106" fill="#9ab2b8" font-size="11">Evidence links · human review</text></g>
  <g transform="translate(873 154)"><rect width="275" height="128" rx="13" fill="#122331" stroke="#2b5261"/><circle cx="27" cy="29" r="13" fill="#173e43"/><text x="23" y="34" fill="#76e4d7" font-size="14">▤</text><text x="20" y="65" fill="#e3edf5" font-size="14" font-weight="650">Operations dashboard</text><text x="20" y="88" fill="#8ea2b3" font-size="11">Live telemetry · incident queue</text><text x="20" y="106" fill="#8ea2b3" font-size="11">Trend view · evidence drawer</text></g>
  <path d="M257 219h54M520 219h54M815 219h54" stroke="#7293a9" stroke-width="2" marker-end="url(#arrow)"/>
