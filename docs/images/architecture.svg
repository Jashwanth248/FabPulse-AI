<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
 <title id="title">FabPulse architecture</title><desc id="desc">Event simulator feeds the API and anomaly detection, then safe triage workflow, procedure retrieval, and dashboard.</desc>
 <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1521"/><stop offset="1" stop-color="#101d2a"/></linearGradient><linearGradient id="a" x2="1"><stop stop-color="#53d7c7"/><stop offset="1" stop-color="#4c9ce7"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#7293a9"/></marker></defs>
 <rect width="1200" height="580" rx="22" fill="url(#bg)"/>
 <text x="54" y="53" fill="#70ddcf" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700" letter-spacing="2">SYSTEM OVERVIEW</text><text x="54" y="88" fill="#eaf2f9" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="650">A bounded workflow, from signal to reviewed recommendation</text>
 <g font-family="Inter,Segoe UI,sans-serif">
